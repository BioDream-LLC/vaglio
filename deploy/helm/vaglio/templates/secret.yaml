{{- if not .Values.pasToken.existingSecret }}
{{- /* The PAS server's bearer token: made once at install, kept on upgrade. */}}
{{- $name := printf "%s-pas-token" .Release.Name }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ if $old }}{{ index $old.data "token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
