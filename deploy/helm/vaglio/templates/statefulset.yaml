apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: vaglio, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}
  selector:
    matchLabels: {app.kubernetes.io/name: vaglio, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vaglio, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: vaglio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The volume's root is the cluster's (group-writable under fsGroup); Vaglio keeps its data in a directory of
          # its own inside it, which it makes private. A later -data overrides the image's.
          args: ["-data", "/data/vaglio", "-hostname", {{ .Values.hostname | quote }}{{ range .Values.args }}, {{ . | quote }}{{ end }}]
          {{- with .Values.env }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports: [{name: https, containerPort: 8740}]
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: https}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{- if .Values.policiesConfigMap }}
            - {name: policies, mountPath: /policies, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- if .Values.policiesConfigMap }}
        - {name: policies, configMap: {name: {{ .Values.policiesConfigMap }}}}
        {{- end }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.storage.size }}}}
