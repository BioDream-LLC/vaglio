name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...
      - name: Check every policy
        shell: bash
        run: go run ./cmd/vaglio check policies/*.vaglio library/*.vaglio

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Type check and test
        working-directory: web
        run: npm ci && npm run typecheck && npm test
