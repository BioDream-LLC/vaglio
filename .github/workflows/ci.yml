name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Document readers and fax tools (optional; the tests that use them run when present)
        if: matrix.os != 'windows-latest'
        run: ${{ matrix.os == 'ubuntu-latest' && 'sudo apt-get update && sudo apt-get install -y poppler-utils libtiff-tools tesseract-ocr' || 'brew install poppler libtiff' }}
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...
      - name: Check every policy
        shell: bash
        run: go run ./cmd/vaglio check policies/*.vaglio library/*.vaglio
      - name: Recovery drill (kill -9 under load; standby takeover)
        if: runner.os != 'Windows'
        run: go build -o bin/vaglio ./cmd/vaglio && go run ./tools/drill -vaglio bin/vaglio

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Type check and test
        working-directory: web
        run: npm ci && npm run typecheck && npm test

  installers:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build this machine's archive
        shell: bash
        run: |
          os=$(go env GOOS) arch=$(go env GOARCH)
          [ "$os" = windows ] && export PYTHON=python
          PLATFORMS="$os/$arch" sh deploy/release.sh v0.0.0 dist
      - name: Install and reach it (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          a=$(ls dist/vaglio-v0.0.0-*)
          sudo sh deploy/install.sh -version v0.0.0 -archive "$a" -sums dist/SHA256SUMS
          for i in $(seq 30); do curl -sk -o /dev/null -w '%{http_code}\n' https://127.0.0.1:8740/api/me | grep -q 401 && break; sleep 1; done
          curl -sk -o /dev/null -w 'console answered %{http_code}\n' https://127.0.0.1:8740/api/me | grep 401
          # Installed again, as an upgrade: data kept.
          sudo sh deploy/install.sh -version v0.0.0 -archive "$a" -sums dist/SHA256SUMS
          sleep 3
          curl -sk -o /dev/null -w 'after upgrade %{http_code}\n' https://127.0.0.1:8740/api/me | grep 401
      - name: A changed archive is refused (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          a=$(ls dist/vaglio-v0.0.0-*); cp "$a" bad.tar.gz; printf x >> bad.tar.gz
          if sudo sh deploy/install.sh -version v0.0.0 -archive bad.tar.gz -sums dist/SHA256SUMS; then exit 1; fi
      - name: Install and reach it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $a = (Get-ChildItem dist\vaglio-v0.0.0-*.zip).FullName
          & .\deploy\install.ps1 -Version v0.0.0 -Archive $a -Sums dist\SHA256SUMS
          $code = 0
          foreach ($i in 1..40) {
            try { Invoke-WebRequest https://127.0.0.1:8740/api/me -SkipCertificateCheck -UseBasicParsing | Out-Null } catch { $code = [int]$_.Exception.Response.StatusCode }
            if ($code -eq 401) { break }; Start-Sleep 1
          }
          Write-Host "console answered $code"; if ($code -ne 401) { Get-ScheduledTaskInfo Vaglio; exit 1 }

  container:
    name: Container image and Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: vaglio
      - name: Build the image and load it into the cluster
        run: |
          docker build -t vaglio:ci .
          kind load docker-image vaglio:ci --name vaglio
      - name: The image alone keeps its data across containers
        run: |
          docker run -d --name one -e VAGLIO_PAS_TOKEN=ci-pas-token-0123456789 -v vdata:/data -p 18740:8740 vaglio:ci -hostname localhost -token-env VAGLIO_PAS_TOKEN
          for i in $(seq 30); do curl -sk -o /dev/null -H 'Host: localhost' https://127.0.0.1:18740/api/me && break; sleep 1; done
          docker logs one 2>&1 | grep -q 'No users existed'
          docker rm -f one
          docker run -d --name two -e VAGLIO_PAS_TOKEN=ci-pas-token-0123456789 -v vdata:/data -p 18740:8740 vaglio:ci -hostname localhost -token-env VAGLIO_PAS_TOKEN
          sleep 5
          if docker logs two 2>&1 | grep -q 'No users existed'; then echo 'the data was lost'; exit 1; fi
          curl -sk -o /dev/null -w '%{http_code}\n' -H 'Host: localhost' https://127.0.0.1:18740/api/me | grep 401
      - name: Lint and install the chart
        run: |
          helm lint deploy/helm/vaglio
          helm install vaglio deploy/helm/vaglio --set image.repository=vaglio --set image.tag=ci \
            --set image.pullPolicy=Never --set hostname=localhost:8740 --wait --timeout 3m
          kubectl rollout status statefulset/vaglio --timeout 2m
          kubectl port-forward svc/vaglio 28740:8740 &
          sleep 3
          curl -sk -o /dev/null -w 'console answered %{http_code}\n' -H 'Host: localhost:8740' https://127.0.0.1:28740/api/me | grep 401
          kubectl exec vaglio-0 -- /usr/local/bin/vaglio version
