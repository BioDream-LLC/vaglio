name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Document readers and fax tools (optional; the tests that use them run when present)
        if: matrix.os != 'windows-latest'
        run: ${{ matrix.os == 'ubuntu-latest' && 'sudo apt-get update && sudo apt-get install -y poppler-utils libtiff-tools tesseract-ocr' || 'brew install poppler libtiff' }}
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...
      - name: Check every policy
        shell: bash
        run: go run ./cmd/vaglio check policies/*.vaglio library/*.vaglio

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Type check and test
        working-directory: web
        run: npm ci && npm run typecheck && npm test
