  <text x="96" y="268" font-family="Georgia, 'Iowan Old Style', serif" font-size="68" fill="#ffffff">Prior authorization</text>
  <text x="96" y="350" font-family="Georgia, 'Iowan Old Style', serif" font-size="68" fill="#ffffff">that has to <tspan fill="#b9a2ff" font-style="italic">show its work.</tspan></text>
