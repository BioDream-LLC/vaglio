<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 440" width="1180" height="440" role="img"
     aria-label="A provider's system sends a prior authorization request to a PAS server such as Perfuse, which asks Vaglio. Vaglio reads the evidence, applies the plan's signed policy, proves the answer and records it. Reviewers, clinicians and auditors use the result.">
  <title>Where Vaglio sits</title>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2e1065"/><stop offset="55%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0b1220"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0abfc"/><stop offset="55%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="ar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e879f9"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/></filter>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a855f7"/></marker>
    <style>.box { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; } .under { font: 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; } .name { font: 800 34px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f5f3ff; } .step { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #ede9fe; } .sub { font: 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #a5b4fc; } .num { font: 700 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f5d0fe; } .lab { font: 600 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #7c3aed; } .tag { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #34d399; }</style>
  </defs>
<rect x="20" y="40" width="250" height="104" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="38" y="70">The provider's system</text><text class="under" x="38" y="92">EHR, practice system or</text><text class="under" x="38" y="111">a Da Vinci DTR app</text><rect x="20" y="176" width="250" height="104" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="38" y="206">A PAS server</text><text class="under" x="38" y="228">Perfuse, or any server</text><text class="under" x="38" y="247">that calls the decision hook</text><rect x="20" y="312" width="250" height="88" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="38" y="342">The plan's systems</text><text class="under" x="38" y="364">appeals, identity (SSO)</text><rect x="910" y="40" width="250" height="104" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="928" y="70">Reviewers</text><text class="under" x="928" y="92">the console: pended cases,</text><text class="under" x="928" y="111">proofs, documents, deadlines</text><rect x="910" y="176" width="250" height="104" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="928" y="206">Clinicians</text><text class="under" x="928" y="228">sign policies off; only they</text><text class="under" x="928" y="247">deny, when the plan says so</text><rect x="910" y="312" width="250" height="88" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="928" y="342">Regulators and auditors</text><text class="under" x="928" y="364">CMS metrics, the audit log</text><rect x="330" y="30" width="520" height="380" rx="26" fill="url(#core)" stroke="url(#edge)" stroke-width="2.5"/><svg x="356" y="52" width="64" height="64" viewBox="0 0 96 96"><defs><linearGradient id="vg" gradientUnits="userSpaceOnUse" x1="20" y1="14" x2="76" y2="70"><stop offset="0" stop-color="#f0abfc"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><clipPath id="bowl"><path d="M22 38 A26 26 0 0 0 74 38 Z"/></clipPath></defs><g fill="url(#vg)"><circle cx="36" cy="21" r="3.6"/><circle cx="48" cy="15" r="3.6"/><circle cx="60" cy="23" r="3.6"/></g><g clip-path="url(#bowl)" stroke="#c4b5fd" stroke-opacity=".55" stroke-width="1.8"><path d="M32 38 V66 M40 38 V66 M48 38 V66 M56 38 V66 M64 38 V66 M20 47 H76 M20 55 H76"/></g><path d="M22 38 A26 26 0 0 0 74 38" fill="none" stroke="url(#vg)" stroke-width="4.5" stroke-linecap="round"/><path d="M16 38 H80" stroke="url(#vg)" stroke-width="4.5" stroke-linecap="round"/><path d="M38 75 l7 7 l14 -14" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><text class="name" x="432" y="96">Vaglio</text><circle cx="374" cy="140" r="16" fill="#a855f7" fill-opacity="0.22" stroke="#c084fc"/><text class="num" x="374" y="145" text-anchor="middle">1</text><text class="step" x="402" y="138">Reads the evidence in the request</text><text class="sub" x="402" y="158">every finding cited to the record</text><circle cx="374" cy="206" r="16" fill="#a855f7" fill-opacity="0.22" stroke="#c084fc"/><text class="num" x="374" y="211" text-anchor="middle">2</text><text class="step" x="402" y="204">Applies the plan's signed policy</text><text class="sub" x="402" y="224">each rule quotes its source</text><circle cx="374" cy="272" r="16" fill="#a855f7" fill-opacity="0.22" stroke="#c084fc"/><text class="num" x="374" y="277" text-anchor="middle">3</text><text class="step" x="402" y="270">Proves the answer</text><text class="sub" x="402" y="290">approve · deny with proof · pend, asking</text><circle cx="374" cy="338" r="16" fill="#a855f7" fill-opacity="0.22" stroke="#c084fc"/><text class="num" x="374" y="343" text-anchor="middle">4</text><text class="step" x="402" y="336">Records it in a chained log</text><text class="sub" x="402" y="356">replayable, tamper-evident</text><text class="tag" x="590" y="398" text-anchor="middle">never denies on missing evidence</text><path d="M145 144 V176" stroke="#c084fc" stroke-width="3" marker-end="url(#tip)" fill="none"/><text class="lab" x="160" y="166">PAS request</text><path d="M270 214 L330 214" stroke="url(#ar)" stroke-width="3" fill="none" marker-end="url(#tip)"/><path d="M330 246 L270 246" stroke="url(#ar)" stroke-width="3" fill="none" marker-end="url(#tip)"/><text class="lab" x="300" y="206" text-anchor="middle">asks</text><text class="lab" x="300" y="266" text-anchor="middle">answers</text><path d="M270 356 L330 356" stroke="url(#ar)" stroke-width="3" fill="none" marker-end="url(#tip)"/><path d="M850 92 L910 92" stroke="url(#ar)" stroke-width="3" fill="none" marker-end="url(#tip)"/><path d="M850 228 L910 228" stroke="url(#ar)" stroke-width="3" fill="none" marker-end="url(#tip)"/><path d="M850 356 L910 356" stroke="url(#ar)" stroke-width="3" fill="none" marker-end="url(#tip)"/>
</svg>
