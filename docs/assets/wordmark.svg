<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" width="560" height="130" role="img" aria-label="Vaglio">
  <title>Vaglio</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d0fe"/><stop offset="38%" stop-color="#e879f9"/><stop offset="72%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gleam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.70"/><stop offset="30%" stop-color="#fff" stop-opacity="0.28"/><stop offset="47%" stop-color="#fff" stop-opacity="0.04"/><stop offset="48%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="40%" stop-color="#fff" stop-opacity="0.32"/><stop offset="52%" stop-color="#fff" stop-opacity="0.32"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#0b1220" flood-opacity="0.30"/></filter>
    <text id="word" x="262" y="92" text-anchor="middle" font-size="86" font-weight="800" letter-spacing="-0.02em"
          font-family="Avenir Next, Avenir, Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">Vaglio</text>
    <clipPath id="letters"><use href="#word"/></clipPath>
  </defs>
  <use href="#word" fill="url(#ink)" filter="url(#lift)"/>
  <g clip-path="url(#letters)">
    <rect x="0" y="0" width="560" height="130" fill="url(#gleam)"/>
    <rect x="-140" y="0" width="260" height="130" fill="url(#sweep)" transform="skewX(-20)"/>
  </g>
  <path d="M410 56 l10 10 l20 -22" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="280" y="122" text-anchor="middle" font-size="15" fill="#64748b" letter-spacing="0.26em" font-family="system-ui, -apple-system, Segoe UI, sans-serif">PRIOR AUTHORIZATION · WITH PROOF</text>
